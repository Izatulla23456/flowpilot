# Render Blueprint — деплой в один клик:
# Render → New → Blueprint → выбрать этот репозиторий → Deploy
services:
  - type: web
    name: flowpilot
    env: node
    plan: free
    # версия Node берётся из "engines" в package.json (Node 22)
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: development
      - key: FLOWPILOT_ADMIN_TOKEN
        sync: false
      # Опционально: ИИ и Telegram (если заполнить — работают и переживают перезапуски)
      - key: AI_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
